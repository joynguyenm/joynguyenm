# /etc/nginx/sites-available/drive-uploader
# Thay drive.example.com bằng tên miền của bạn, rồi chạy:
#   sudo ln -s /etc/nginx/sites-available/drive-uploader /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d drive.example.com
server {
    listen 80;
    server_name drive.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # (Tùy chọn) noVNC — nên đặt thêm mật khẩu Nginx (auth_basic) hoặc chỉ dùng SSH tunnel
